# Builds the test APK and the Play .aab on every push to main and publishes them
# on the "latest" GitHub release. tools/desktop-sync.ps1 copies them to the Desktop.
name: Build test APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-latest
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK and AAB
        # desktopDir makes the copy tasks write LedBanner-test.apk and
        # LedBanner-release-<version>.aab into one folder.
        run: bash ./gradlew assembleDebug bundleRelease --console=plain -PdesktopDir="$RUNNER_TEMP/out"

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/out"
          ls -l
          if ! gh release view latest >/dev/null 2>&1; then
            gh release create latest --prerelease --title "Latest test build" --notes "Built automatically from main."
          fi
          gh release upload latest LedBanner-test.apk LedBanner-release-*.aab --clobber
          # Drop .aab files from older versions
          for old in $(gh release view latest --json assets -q '.assets[].name' | grep -E '^LedBanner-release-.*\.aab$'); do
            [ -e "$old" ] || gh release delete-asset latest "$old" -y
          done
          gh release edit latest --notes "Built automatically from main at ${GITHUB_SHA::7}."
